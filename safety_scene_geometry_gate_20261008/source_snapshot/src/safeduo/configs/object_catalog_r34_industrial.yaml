# R34 industrial-assembly catalogue (design line, 2026-09-07): 4040/4080 aluminium T-slot
# frame-assembly assets generated by assets_src/tasks/r34/gen_r34_assets.py (usd-core, no Isaac).
# Same schema as object_catalog_lab.yaml (name -> usd [repo-relative], size = AABB in m, mass,
# grasp hints consumed by delta/task_library_r34.py: width / depth_from_top / squeeze_extra, so
# LabObject(catalog="profile_4080_L300") works unchanged). Every USD authors RigidBody / Mass / Collision APIs itself;
# fixtures author physics:kinematicEnabled=true so they stay put without env-side flags.
# size for the two profiles equals the R26 rod constants on purpose:
#   profile_4080_L300 -> ROD_PHYS_SIZE (0.04, 0.30, 0.08): lying 8 cm tall, fingertips clear the table
#   profile_4040_L300 -> ROD_SIZE      (0.04, 0.30, 0.04): needs the rack (profile_rack) or a 2-arm carry
profile_4080_L300:
  usd: assets_src/tasks/r34/usd/profile_4080_L300.usda
  size: [0.04, 0.30, 0.08]
  mass: 0.78
  grasp: {width: 0.04, depth_from_top: 0.03, squeeze_extra: 0.06, kind: top_pinch_mid, note: "F2 pinch across the 4 cm width at mid-length = R26 rod_pick phys primitive (frames grasp_mid/grasp_end_*)"}
profile_4080_L450:
  usd: assets_src/tasks/r34/usd/profile_4080_L450.usda
  size: [0.04, 0.45, 0.08]
  mass: 1.17
  grasp: {width: 0.04, depth_from_top: 0.03, squeeze_extra: 0.06, kind: top_pinch_mid, note: "heavy: two-arm carry (F_L + F_R at the two ends)"}
