    - {name: crate_sw, usd: assets_real/isaac/Assets/Isaac/4.5/Isaac/Environments/Simple_Warehouse/Props/SM_CratePlastic_A_01.usd,
       pos: [-1.75, -1.55, 0.0], yaw: 20.0, collision: false}
