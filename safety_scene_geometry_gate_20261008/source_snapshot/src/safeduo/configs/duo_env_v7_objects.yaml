# SafeDuo v7 + tabletop task objects (R17 S9, 2026-08-20).
# Inherits duo_env_v7.yaml verbatim (load_config extends deep-merge) and only
# adds assets.table_objects -- the demo prop for the recognizable basic tasks
# (grasp / pick_place / dual-arm handover). Everything else (safety params,
# init_qpos, coordinator, physx) stays single-sourced in duo_env_v7.yaml.
#
# cube_main position = the F_L pick point of the S9 choreography
# (src/safeduo/delta/task_record_s9.py CUBE_POS; pinned by
# tests/test_s9_object_tasks.py). Table top z=0.80, 5 cm cube => center 0.825.
# Objects are demo props: NOT in the sphere safety model, NOT in the policy
# observation; training path never loads this yaml.
extends: duo_env_v7.yaml

assets:
  table_objects:
    - name: cube_main
      pos: [0.54, -0.22, 0.825]
      size: 0.05
      color: [0.85, 0.20, 0.15]
      mass: 0.2
      static_friction: 1.5
      dynamic_friction: 1.2
