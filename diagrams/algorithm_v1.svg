<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs><rect width="1480" height="900" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">SafeDuo 算法框图 —— 学习型安全离合器（α+p）+ 解析兜底，PPO-Lagrangian（PID 乘子）训练</text><text x="20" y="48" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">v1 · 2026-09-08 · 配方 aF（a27 课程 @ v8 布局 + 最终执行栈 fix2_la06）</text><rect x="14" y="62" width="1452" height="262" rx="14" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3,5" opacity="0.8"/><text x="28" y="80" font-size="12.5" font-weight="700" fill="#0284c7">① 运行时回路（每控制步，训练与真机同一套语义）</text><rect x="30" y="96" width="210" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="42" y="118" font-size="14" font-weight="700" fill="#1e293b">双人遥操 / 虚拟操作员</text><text x="42" y="138" font-size="12" fill="#334155">F 操作员 → FR3_L, FR3_R（F2 手）</text><text x="42" y="155" font-size="12" fill="#334155">U 操作员 → UR5e_L, UR5e_R（DFX 手）</text><text x="42" y="172" font-size="12" fill="#334155">指令 Δq_cmd：28 关节增量 / 步</text><text x="42" y="189" font-size="12" fill="#334155">训练期 = 技能库回放 + 随机漫游流</text><text x="42" y="206" font-size="12" fill="#334155">  幅度课程 0.03→0.10 rad，混流 0.2</text><text x="42" y="223" font-size="12" fill="#334155">  受控会合：v_rel ≤ 0.15 m/s 豁免</text><text x="42" y="240" font-size="12" fill="#334155">（规划）伙伴扰动：速度缩放/噪声/时序偏移</text><rect x="270" y="96" width="250" height="200" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="282" y="118" font-size="14" font-weight="700" fill="#1e293b">观测构造（275 维，状态式）</text><text x="282" y="138" font-size="12" fill="#334155">四臂 q, q̇ + 指令 Δq_cmd</text><text x="282" y="155" font-size="12" fill="#334155">成对特征：[距离, 接近速度, 类别 onehot]</text><text x="282" y="172" font-size="12" fill="#334155">  类别 = 跨机 / 自碰 / 桌面（最差对）</text><text x="282" y="189" font-size="12" fill="#334155">arm-aware 配对观测（R15）</text><text x="282" y="206" font-size="12" fill="#334155">p2-obs：上一步 α / p（R18）</text><text x="282" y="223" font-size="12" fill="#334155">臂几何壳：F2 三球/指 v7fix，UR 连杆球</text><text x="282" y="240" font-size="12" fill="#334155">（规划）30 步历史签名 / 力矩反馈</text><rect x="550" y="96" width="250" height="200" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="562" y="118" font-size="14" font-weight="700" fill="#1e293b">策略网络（Beta actor）</text><text x="562" y="138" font-size="12" fill="#334155">输出 α₁..α₄：逐臂危险概率 ∈ (0,1)</text><text x="562" y="155" font-size="12" fill="#334155">      p：刹停/保持量（联合 Beta）</text><text x="562" y="172" font-size="12" fill="#334155">有界支撑 → 不卡在动作边界</text><text x="562" y="189" font-size="12" fill="#334155">危险头（hazard head）共享干路</text><text x="562" y="206" font-size="12" fill="#334155">训练期 α 在 0.5 二值化，</text><text x="562" y="223" font-size="12" fill="#334155">  直通估计器回传梯度（消除</text><text x="562" y="240" font-size="12" fill="#334155">  训练-执行失配，R18）</text><rect x="830" y="96" width="250" height="200" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/><text x="842" y="118" font-size="14" font-weight="700" fill="#1e293b">离合器（执行语义，R17/R18/R30）</text><text x="842" y="138" font-size="12" fill="#334155">α &lt; 0.5：该臂指令逐位直通，零衰减</text><text x="842" y="155" font-size="12" fill="#334155">α ≥ 0.5：仅冻结涉险臂（其余臂不动）</text><text x="842" y="172" font-size="12" fill="#334155">后撤方向指令直通（retreat_release）</text><text x="842" y="189" font-size="12" fill="#334155">恢复 = 操作员逐臂解锁</text><text x="842" y="206" font-size="12" fill="#334155">误刹 = 无险情却冻结（软指标）</text><text x="842" y="223" font-size="12" fill="#334155">cmd-stop 时延 p50 / p95</text><rect x="1110" y="96" width="250" height="200" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/><text x="1122" y="118" font-size="14" font-weight="700" fill="#1e293b">解析 backstop（硬兜底）</text><text x="1122" y="138" font-size="12" fill="#334155">几何距离 + 前瞻 0.06 s 速度感知阻尼带</text><text x="1122" y="155" font-size="12" fill="#334155">结构行豁免（UR upper_arm×桌，R29）</text><text x="1122" y="172" font-size="12" fill="#334155">桌面 / 自碰 / 跨机三类最小距离</text><text x="1122" y="189" font-size="12" fill="#334155">臂执行器保真：UR armature 0.05，</text><text x="1122" y="206" font-size="12" fill="#334155">  FR3/UR 重力补偿（R33 = 栈 fix2）</text><text x="1122" y="223" font-size="12" fill="#334155">→ 任意指令零损坏碰撞的最后一道</text><line x1="240" y1="196" x2="270" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="255.0" y="190.0" font-size="11.5" fill="#475569" text-anchor="middle">Δq_cmd</text><line x1="520" y1="196" x2="550" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="535.0" y="190.0" font-size="11.5" fill="#475569" text-anchor="middle">o_t</text><line x1="800" y1="196" x2="830" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="815.0" y="190.0" font-size="11.5" fill="#475569" text-anchor="middle">α, p</text><line x1="1080" y1="196" x2="1110" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="1095.0" y="190.0" font-size="11.5" fill="#475569" text-anchor="middle">Δq_gate</text><rect x="1110" y="340" width="250" height="150" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/><text x="1122" y="362" font-size="14" font-weight="700" fill="#1e293b">机器人 / 仿真</text><text x="1122" y="382" font-size="12" fill="#334155">Isaac Lab 4096 并行环境（A100 30109）</text><text x="1122" y="399" font-size="12" fill="#334155">四臂 v8 布局：两排 1.296 m 面对面</text><text x="1122" y="416" font-size="12" fill="#334155">任务物体：R34 工业装配族（4080 横梁、</text><text x="1122" y="433" font-size="12" fill="#334155">  外框夹具 v2 锥口搁座、角件、料箱）</text><text x="1122" y="450" font-size="12" fill="#334155">真机：FR3×2 + UR5e×2 + Inspire 五指手</text><line x1="1235" y1="296" x2="1235" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="1235.0" y="312.0" font-size="11.5" fill="#475569" text-anchor="middle">执行 Δq_exec</text><polyline points="1110,415 700,415 700,330 395,330 395,296" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="800" y="408" font-size="11.5" fill="#475569" text-anchor="middle">状态 s_{t+1}（四臂 q, q̇, 物体位姿）</text><rect x="14" y="336" width="1080" height="370" rx="14" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,5" opacity="0.8"/><text x="28" y="354" font-size="12.5" font-weight="700" fill="#dc2626">② 训练信号（PPO-Lagrangian，自建循环 safeduo/algo/lagrangian_ppo.py）</text><rect x="30" y="370" width="250" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="42" y="392" font-size="14" font-weight="700" fill="#1e293b">代价通道（约束，不进奖励）</text><text x="42" y="412" font-size="12" fill="#334155">cross / self / table：最差对接近代价</text><text x="42" y="429" font-size="12" fill="#334155">  由标准观测重建（无 env 钩子）</text><text x="42" y="446" font-size="12" fill="#334155">cost-scale 4 / 17 / 19</text><text x="42" y="463" font-size="12" fill="#334155">上限 0.04 / 0.05 / 0.05</text><text x="42" y="480" font-size="12" fill="#334155">有效性感知 GAE（真终止 vs 超时）</text><rect x="310" y="370" width="250" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="322" y="392" font-size="14" font-weight="700" fill="#1e293b">PID-Lagrangian 乘子 λ</text><text x="322" y="412" font-size="12" fill="#334155">每迭代按 rollout 均值更新</text><text x="322" y="429" font-size="12" fill="#334155">kp 0.5 / ki 0.05 / kd 0.1，积分限幅</text><text x="322" y="446" font-size="12" fill="#334155">上限 λ_max 0.35 / 0 / 0.05（防绕组）</text><text x="322" y="463" font-size="12" fill="#334155">变化率 ≤ 0.01 / 更新（防震荡）</text><text x="322" y="480" font-size="12" fill="#334155">超限 → 抬高惩罚；回限 → 放松</text><rect x="590" y="370" width="250" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="602" y="392" font-size="14" font-weight="700" fill="#1e293b">PPO 更新</text><text x="602" y="412" font-size="12" fill="#334155">裁剪代理目标 0.2，GAE λ 0.95</text><text x="602" y="429" font-size="12" fill="#334155">四个价值头：reward + 3 代价</text><text x="602" y="446" font-size="12" fill="#334155">熵系数 0.006 ↔ 0.012（熵 EMA 触发</text><text x="602" y="463" font-size="12" fill="#334155">  −3.5 / 释放 −3.2，代价门 0.9）</text><text x="602" y="480" font-size="12" fill="#334155">48 步/环境/迭代 × 3600 迭代 ≈ 7e8 步</text><rect x="30" y="546" width="250" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="42" y="568" font-size="14" font-weight="700" fill="#1e293b">奖励（跟随操作员）</text><text x="42" y="588" font-size="12" fill="#334155">指令保真：执行 = 遥操输入的程度</text><text x="42" y="605" font-size="12" fill="#334155">最小干预：不必要的刹停被扣分</text><text x="42" y="622" font-size="12" fill="#334155">逐臂 α 均衡正则 w 0.01（R15：</text><text x="42" y="639" font-size="12" fill="#334155">  防 F_L 成为约束汇）</text><text x="42" y="656" font-size="12" fill="#334155">PBRS 项（余量 Φ 差分，R6 待消融）</text><rect x="310" y="546" width="250" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="322" y="568" font-size="14" font-weight="700" fill="#1e293b">危险 BCE（辅助监督，R18/R28）</text><text x="322" y="588" font-size="12" fill="#334155">事后标签：未来 30 步内该臂真越线？</text><text x="322" y="605" font-size="12" fill="#334155">会合豁免：v_rel ≤ 0.15 不算危险</text><text x="322" y="622" font-size="12" fill="#334155">尾部掩码 + 正负样本平衡，w 0.5</text><text x="322" y="639" font-size="12" fill="#334155">α 死区惩罚 w 2.0（推向 0 或 1）</text><text x="322" y="656" font-size="12" fill="#334155">→ α 是校准过的“危险分类器”</text><rect x="590" y="546" width="250" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="602" y="568" font-size="14" font-weight="700" fill="#1e293b">课程与随机化</text><text x="602" y="588" font-size="12" fill="#334155">指令幅度 0.03 → 0.10 rad（delta 课程 v7）</text><text x="602" y="605" font-size="12" fill="#334155">技能混流 0.2 + 全域漫游流（R25）</text><text x="602" y="622" font-size="12" fill="#334155">物体质量/摩擦随机（R34 目录）</text><text x="602" y="639" font-size="12" fill="#334155">（规划）伙伴扰动 = SAI Stage-2</text><text x="602" y="656" font-size="12" fill="#334155">（规划）基座 ±2–5 cm，灯光，桌面材质</text><line x1="280" y1="445" x2="310" y2="445" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="295.0" y="439.0" font-size="11.5" fill="#475569" text-anchor="middle">J_c &gt; limit?</text><line x1="560" y1="445" x2="590" y2="445" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="575.0" y="439.0" font-size="11.5" fill="#475569" text-anchor="middle">λ·J_c</text><line x1="155" y1="546" x2="155" y2="520" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5,4"/><line x1="435" y1="546" x2="435" y2="520" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5,4"/><line x1="715" y1="546" x2="715" y2="520" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5,4"/><polyline points="1110,470 900,470 900,445 840,445" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/><text x="980" y="463" font-size="11.5" fill="#475569" text-anchor="middle">越线 / 接近 / 危险标签</text><polyline points="715,370 715,350 675,350 675,296" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5,4"/><text x="560" y="346" font-size="11.5" fill="#475569" text-anchor="middle">梯度 → 策略参数</text><rect x="14" y="718" width="1452" height="168" rx="14" fill="none" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="3,5" opacity="0.8"/><text x="28" y="736" font-size="12.5" font-weight="700" fill="#ea580c">③ 评测与验收（四门口径 R28：25 环境 × 60 s，θ = 0.5 : 0.2）</text><rect x="30" y="750" width="330" height="118" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="42" y="772" font-size="14" font-weight="700" fill="#1e293b">硬门（必须全 1.0）</text><text x="42" y="792" font-size="12" fill="#334155">brake：涉险时确实刹停</text><text x="42" y="809" font-size="12" fill="#334155">viol-free(cross)：跨机零越线（min cross &gt; 0）</text><text x="42" y="826" font-size="12" fill="#334155">no-deadlock(hys)：不出现双方互锁</text><text x="42" y="843" font-size="12" fill="#334155">→ a30b@stack_fix 0.96 未闭合 → aF 重训</text><rect x="380" y="750" width="330" height="118" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="392" y="772" font-size="14" font-weight="700" fill="#1e293b">软指标（越好越优）</text><text x="392" y="792" font-size="12" fill="#334155">误刹率 arm / any（无险情却刹）</text><text x="392" y="809" font-size="12" fill="#334155">指令保真 fidelity，平均衰减</text><text x="392" y="826" font-size="12" fill="#334155">任务完成度 done（hys / manual）</text><text x="392" y="843" font-size="12" fill="#334155">cmd-stop 时延 p50 / p95</text><rect x="730" y="750" width="350" height="118" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="742" y="772" font-size="14" font-weight="700" fill="#1e293b">对照与消融</text><text x="742" y="792" font-size="12" fill="#334155">raw 直通 vs 门控 s0 vs 旧运动学吸附</text><text x="742" y="809" font-size="12" fill="#334155">执行栈谱系：r18 → stack → fix → fix2 → la06 → v8</text><text x="742" y="826" font-size="12" fill="#334155">算法淘汰赛 R3：SAC-Lag / WCSAC / CPO（待排）</text><text x="742" y="843" font-size="12" fill="#334155">跨架构红线：A100 结果不与 5090 结果配对</text><rect x="1100" y="750" width="350" height="118" rx="10" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6" stroke-dasharray="6,4"/><text x="1112" y="772" font-size="14" font-weight="700" fill="#1e293b">规划中（R35，参考 SAI / TRACE）</text><text x="1112" y="792" font-size="12" fill="#334155">相位同步率（2–5 检查点 + 时序容差）</text><text x="1112" y="809" font-size="12" fill="#334155">伙伴延迟探针（一方随机停 0.5–2 s）</text><text x="1112" y="826" font-size="12" fill="#334155">路径签名意图特征 / 级联门控头</text><text x="1112" y="843" font-size="12" fill="#334155">分臂顺序微调 + 逐臂损失掩码</text></svg>